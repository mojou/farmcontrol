<!-- Modale "Administre" partagee entre la liste "a administrer maintenant"
     et le tableau complet (voir sanitary_program.html) - inclut un modal_id
     unique passe par l'appelant pour eviter les id HTML dupliques quand le
     meme element apparait dans les deux listes. -->
<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{{ url_for('poultry.sanitary_program_mark_done', item_id=item.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-header">
          <h5 class="modal-title">{{ item.product_name }} - Jour {{ item.day_number }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">
            Si ce produit vient de votre stock, indiquez la quantite donnee pour qu'elle soit deduite
            automatiquement. Sinon (vaccin a dose unique, produit non suivi en stock...), laissez vide et
            cochez juste "Administre".
          </p>
          <div class="mb-3">
            <label class="form-label">Quantite administree (en ml, facultatif)</label>
            <input type="number" step="0.01" min="0" name="quantity_ml" class="form-control" placeholder="Ex : 50">
          </div>
          <div class="mb-3">
            <label class="form-label">Article de stock a decompter (facultatif)</label>
            <select name="stock_item_id" class="form-select">
              <option value="0">Aucun</option>
              {% for value, label in medication_stock_choices %}
                {% if value %}<option value="{{ value }}">{{ label }}</option>{% endif %}
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Confirmer administre</button>
        </div>
      </form>
    </div>
  </div>
</div>
