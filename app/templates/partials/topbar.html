<header class="fc-topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-secondary fc-sidebar-toggle" type="button" aria-label="Menu">
      <i class="bi bi-list"></i>
    </button>
    <span class="text-muted small">{{ current_user.tenant.name if current_user.tenant else "Plateforme" }}</span>
  </div>
  <div class="d-flex align-items-center gap-3">
    <a href="{{ url_for('core.alerts_list') }}" class="text-decoration-none text-dark position-relative" title="Alertes">
      <i class="bi bi-bell fs-5"></i>
      {% if unread_alerts_count %}
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.6rem;">
        {{ unread_alerts_count }}
      </span>
      {% endif %}
    </a>
    <div class="dropdown">
      <button class="btn btn-sm btn-light dropdown-toggle border" type="button" data-bs-toggle="dropdown">
        {% if current_user.avatar_path %}
        <img src="{{ url_for('core.uploaded_file', filename=current_user.avatar_path) }}" alt=""
             class="rounded-circle me-1" style="width: 20px; height: 20px; object-fit: cover;">
        {% else %}
        <i class="bi bi-person-circle me-1"></i>
        {% endif %}
        {{ current_user.full_name }}
        <span class="badge bg-secondary ms-1">{{ current_user.role_label }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{{ url_for('core.profile') }}">Mon profil</a></li>
        <li><a class="dropdown-item" href="{{ url_for('auth.change_password') }}">Changer le mot de passe</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}">Deconnexion</a></li>
      </ul>
    </div>
  </div>
</header>
