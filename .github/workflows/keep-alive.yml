name: Garder Farm Control eveille

# Le tier gratuit Render met le service en veille apres ~15 minutes
# d'inactivite (la premiere requete suivante prend alors 30-60s pour
# reveiller le conteneur). Ce workflow visite le site toutes les 10
# minutes pour eviter cette mise en veille.
#
# Note : GitHub desactive automatiquement les workflows programmes apres
# 60 jours sans aucune activite (commit/push) sur le depot. Si le ping
# s'arrete, un tour dans l'onglet "Actions" du depot GitHub et un clic sur
# "Enable workflow" suffit a le relancer.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiter la page de connexion
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://farmcontrol-tdwp.onrender.com/auth/login || echo "Ping echoue (sans gravite, nouvelle tentative dans 10 min)"
